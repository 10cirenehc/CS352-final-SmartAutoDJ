[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartautodj"
version = "0.1.0"
description = "Structure-Aware Automatic DJ Transitions (CS352 Music Perception final project)"
requires-python = ">=3.10"
dependencies = [
    "librosa",
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile",
    # High-quality, transient-aware time-stretch (DJ-grade). Wraps the RubberBand
    # CLI -> also needs the binary: `brew install rubberband`. Falls back to
    # librosa's phase vocoder if the binary is missing.
    "pyrubberband",
]

[project.optional-dependencies]
# Optional analysis upgrades (install per CLAUDE.md; carry install risk).
allin1 = ["allin1"]           # local-only; fragile NATTEN/madmom matrix, broken in Colab
beat_this = []                # install from zip per CLAUDE.md; Colab/CPU-friendly downbeats
# Pretrained genre classifier -> genre-driven transition style. CPU-friendly
# distilHuBERT/GTZAN on the existing torch stack (torch comes in via beat_this).
genre = ["transformers", "torch", "torchaudio"]
# Remote tier-3 generation on Modal (CUDA musicgen-style). Local side is just the
# lightweight client; audiocraft/torch-2.1 live ONLY in the Modal image (infra/).
gen = ["modal"]
dev = ["pytest"]

[project.scripts]
smartautodj = "smartautodj.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
