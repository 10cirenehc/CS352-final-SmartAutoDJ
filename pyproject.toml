[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartautodj"
version = "0.1.0"
description = "Structure-Aware Automatic DJ Transitions (CS352 Music Perception final project)"
requires-python = ">=3.10"
dependencies = [
    "librosa",
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile",
]

[project.optional-dependencies]
# Optional analysis upgrade (install per CLAUDE.md; carries install risk).
allin1 = ["allin1"]
dev = ["pytest"]

[project.scripts]
smartautodj = "smartautodj.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
